spring:
  datasource:
    url: jdbc:h2:mem:wakesong;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: http://localhost:8000
