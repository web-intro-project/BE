spring:
  application:
    name: wakesong
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wakesong?characterEncoding=UTF-8}
    username: ${DB_USERNAME:wakesong}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    # FE 개발 서버(python3 -m http.server 8000) 기본값. 배포 시 실제 FE 주소로 지정한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000}
