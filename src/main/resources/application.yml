spring:
  application:
    name: wakesong
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wakesong?characterEncoding=UTF-8}
    username: ${DB_USERNAME:wakesong}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
