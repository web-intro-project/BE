# ============================================================
# 기본 설정 (MySQL 사용)
# ${이름:기본값} = 환경변수 "이름"이 있으면 그 값, 없으면 기본값을 쓰는 문법
# ============================================================

# 스프링 관련 설정을 시작하는 코드
spring:
  # 애플리케이션 정보 설정을 시작하는 코드
  application:
    # 애플리케이션 이름을 wakesong으로 정하는 코드
    name: wakesong

  # DB 접속 정보 설정을 시작하는 코드
  datasource:
    # 기본 실행은 MySQL 사용. local 프로필을 지정하면 H2로 전환된다.
    url: ${DB_URL:jdbc:mysql://localhost:3306/wakesong?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    # 실제 비밀번호는 실행할 셸의 환경변수로 지정한다.
    password: ${DB_PASSWORD:}

  # JPA(엔티티 ↔ DB) 설정을 시작하는 코드
  jpa:
    # 응답을 만드는 동안 DB 연결을 붙잡고 있지 않게 하는 코드
    open-in-view: false
    # Hibernate(JPA 구현체) 설정을 시작하는 코드
    hibernate:
      # 서버 시작 시 엔티티를 보고 테이블을 만들거나 고치게 하는 코드 (update | validate | none)
      ddl-auto: ${DDL_AUTO:update}
    # Hibernate 세부 설정을 시작하는 코드
    properties:
      hibernate:
        jdbc:
          # 시각(created_at)을 DB에 UTC로 저장하게 하는 코드
          time_zone: UTC

# 우리 애플리케이션 전용 설정을 시작하는 코드
app:
  # CORS 설정을 시작하는 코드
  cors:
    # API를 호출할 수 있는 FE 주소 목록을 정하는 코드 (쉼표로 구분, 기본값은 FE 개발 서버)
#    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8000,http://0.0.0.0:8000,https://newsletters-floral-comes-ontario.trycloudflare.com, https://web-intro.vercel.app}
