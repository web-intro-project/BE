# ============================================================
# local 프로필: MySQL 없이 바로 실행할 때 쓰는 설정
#   ./gradlew bootRun --args='--spring.profiles.active=local'
# application.yml 위에 덮어써서 DB만 H2 파일 DB로 바꾼다.
# ============================================================

# 스프링 관련 설정을 시작하는 코드
spring:
  # DB 접속 정보 설정을 시작하는 코드
  datasource:
    # ./data 폴더의 H2 파일 DB를 MySQL 문법 모드로 쓰게 하는 코드 (서버를 다시 켜도 데이터 유지)
    url: jdbc:h2:file:./data/wakesong;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    # H2 기본 사용자 이름을 정하는 코드
    username: sa
    # 비밀번호 없이 접속하게 하는 코드
    password:
