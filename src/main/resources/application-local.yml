# ============================================================
# local 프로필: MySQL 없이 바로 실행할 때
#   ./gradlew bootRun --args='--spring.profiles.active=local'
#
# application.yml 위에 덮어쓰는 설정이다. DB만 H2(파일 DB)로 바꾼다.
# 데이터는 ./data 폴더에 저장되어 서버를 다시 켜도 남아 있다.
# ============================================================
spring:
  datasource:
    # MODE=MySQL: MySQL 문법으로 동작, DATABASE_TO_LOWER: 테이블·컬럼 이름을 소문자로
    url: jdbc:h2:file:./data/wakesong;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
